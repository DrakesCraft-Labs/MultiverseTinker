name: MultiverseTinker
version: ${project.version}
main: com.chagui68.multiversetinker.MultiverseTinker
api-version: "1.21"
author: Chagui68
description: Modular tools, weapons and armor with exclusive perks and animations per equipment type, geological archaeology, smeltery crucible, alloy codex and prime-alloy metallurgy for Paper 1.21+.
website: https://github.com/DrakesCraft-Labs/MultiverseTinker

# Single command, no aliases: /mvtink is the only name this plugin answers to.
# The command itself carries no permission so /mvtink codex stays open to everyone; every other
# subcommand enforces multiversetinker.admin on its own.
commands:
  mvtink:
    description: Main management command for MultiverseTinker.
    usage: /mvtink <craft|give|forge|codex|verify|reload>

# Every surface can also be opened to everyone — or restricted to operators — from config.yml
# (access.codex, access.forge, access.archaeology, access.admin-commands), so servers without a
# permissions plugin never have to depend on one. These nodes only decide the surfaces left on
# "permission".
permissions:
  multiversetinker.admin:
    description: Full administrative access to MultiverseTinker commands (/mvtink craft, give, forge, verify and reload).
    default: op
  multiversetinker.codex:
    description: Allows opening the Alloy Codex (mineral catalog, recipes, forged alloys and the combination explorer).
    default: true
  multiversetinker.forge:
    description: Allows using the multiverse Forge, its GUI, the Alloy Crucible and the casting cauldron.
    default: true
  multiversetinker.archaeology:
    description: Allows using the brush to extract minerals via archaeology.
    default: true
