# ========================================================
#            MultiverseTinker - Configuration
#                     Author: Chagui68
# ========================================================

# Geological Archaeology System (Brushing extraction)
archaeology:
  # Enable or disable geological extraction via brushing
  enabled: true

  # Duration of the brushing process in ticks (20 ticks = 1 second)
  brushing-duration-ticks: 30

  # Durability lost by the brush per completed extraction
  brush-durability-cost: 1

  # Base success probability to extract a mineral on completion (0.0 to 1.0)
  success-chance:
    overworld: 0.45
    nether: 0.40
    the_end: 0.35

  # Block degradation behavior after extraction
  # Options:
  #   - DEGRADE: Stone -> Cobblestone -> Gravel -> Air
  #   - COOLDOWN: Block remains intact but enters cooldown
  #   - NONE: Block remains intact without change
  block-behavior: "DEGRADE"

  # Anti-macro cooldown per block in seconds
  block-cooldown-seconds: 15

  # Yield distribution for normal brush (only raw ores or nuggets, no blocks)
  normal-brush-yield:
    nugget-chance: 0.30

  # Yield distribution for prospector brush (can discover entire storage blocks!)
  prospector-brush-yield:
    block-chance: 0.20
    nugget-chance: 0.25

  # Sound and visual effects
  effects:
    sound-volume: 1.0
    particles-enabled: true

# Smeltery Crucible Settings
smeltery:
  # Probability (0.0 to 1.0) that a lava block underneath is consumed upon completing a melt (0.10 = 10% chance)
  lava-consume-chance: 0.10

  # Smelting duration multiplier for Magma Block heat source (1.30 = 30% slower smelting speed)
  magma-duration-multiplier: 1.30

# Item lore presentation (tooltips)
#
# Minecraft never wraps a multi-coloured lore line: a row wider than the window is clipped, which
# used to hide weapon perks and trait descriptions. Long lore rows are word-wrapped to fit instead.
lore:
  # Split long lore rows at word boundaries so nothing runs off the screen
  wrap-long-lines: true

  # Maximum width of a wrapped lore row, in default-font pixels
  # (a lowercase character averages ~6px, the tooltip area is ~200px in vanilla)
  # Lower it for narrower tooltips with more rows, raise it for wider tooltips with fewer rows.
  max-line-width-pixels: 190

  # Wider budget for the first two rows of modular equipment (tier tag + progress bar).
  # Those rows are rewritten in place every time an item levels up, so they must stay intact.
  header-line-width-pixels: 320

# Signature perk animations
#
# Every weapon, tool and armor type owns an exclusive choreography (its own particle pattern and
# sound), so no equipment family looks more finished than another. Animations play when the
# equipment's perk actually fires and are tinted with the colour of its dominant mineral.
animations:
  # Play the perk choreographies
  enabled: true

  # Multiplies the particle count of every animation (0.25 to 3.0)
  particle-scale: 1.0

  # Play the signature sound of each animation
  sounds: true

  # Minimum delay between two animations of the same type on the same player, in milliseconds.
  # Keeps fast procs (a broadsword sweep, a chestplate hit) from turning into a strobe.
  cooldown-millis: 400

# Modular equipment rules
#
# Forged weapons, tools and armor carry their own durability counter, so Minecraft and the plugin
# would both spend durability on the same swing. Vanilla wear is therefore always disabled (the item
# is unbreakable and its lore row reports the remaining durability) and the damage can be chosen:
equipment:
  # true  -> a weapon hits as hard as the attack damage rolled from its minerals (printed in its lore)
  # false -> the base vanilla material's attack damage is kept; durability stays modular either way
  modular-attack-damage: true

  # true  -> armor defends with the Defense, Toughness and knockback resistance rolled from its
  #          minerals and its evolution tier (printed in its lore), instead of the vanilla values of
  #          the tier's own material. Already-forged pieces are refreshed when their tier evolves.
  # false -> modular armor keeps the vanilla protection of its tier material
  modular-armor-defense: true

# Who may use each part of the plugin
#
# Every surface below can be ruled on here, so a server decides with this file alone and needs no
# permissions plugin:
#
#   public     -> every player, no permission node involved
#   op         -> server operators only
#   permission -> the node declared in plugin.yml (multiversetinker.codex, .forge, .archaeology),
#                 so LuckPerms, PermissionsEx or a permissions.yml can still narrow it
#
# Anything unrecognised falls back to the default, so a typo can never lock a server out of its own
# forge. Changing a value applies on /mvtink reload, no restart.
#
# The administrative /mvtink subcommands are NOT here, on purpose: giving items, forging equipment,
# counting the registry and reloading the plugin are administrator work, so they always require
# multiversetinker.admin (operators by default, or whoever a permissions plugin grants it to). The
# only command meant for players is /mvtink codex, and this file decides whether they get it.
access:
  # Browse the Alloy Codex (/mvtink codex, and the book button in the Alloy Crucible tab)
  codex: public

  # Use the multiblock Forge, its GUI, the Alloy Crucible and the casting cauldron
  forge: public

  # Brush minerals out of valid geological blocks
  archaeology: public

# Rarity weights of the minerals geology hands out
#
# A mineral is rolled inside its own dimension: the higher a rarity's weight, the more often its
# minerals come out of the stone. With the shipped values a legendary is roughly one extraction in
# a hundred, and raising "common" makes the world more forgiving.
#
# Weights are relative, so any set of numbers works; 0 removes that rarity from geology entirely
# (0 on legendary = no legendary ore drops) and negative values are read as 0. If every weight ends
# up at 0 the shipped values below are used instead, so the table can never run dry.
#
# The prospector brush still rolls rare, epic and legendary minerals twice as often.
rarity-weights:
  common: 50
  uncommon: 30
  rare: 14
  epic: 5
  legendary: 1

# Chat and action bar messages
messages:
  brushing-started: "<gray>Brushing the stone carefully...</gray>"
  brushing-completed-success: "<gradient:#00ffaa:#00aaff>You discovered a mineral fragment!</gradient>"
  brushing-completed-fail: "<gray>You found only loose rubble and stone dust.</gray>"
  block-in-cooldown: "<red>This geological surface was investigated recently.</red>"

  # Refusal shown when access.<surface> is not "public" and the player does not qualify.
  access-denied:
    codex: "<red>You do not have permission to open the Alloy Codex.</red>"
    forge: "<red>You do not have permission to use the Forge and the Alloy Crucible.</red>"
    archaeology: "<red>You do not have permission to perform geological archaeology.</red>"
    admin-commands: "<red>You do not have permission to execute this command.</red>"
