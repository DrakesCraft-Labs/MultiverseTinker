<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="MultiverseTinker Banner">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Acento "molten": ambar -> purpura Multiverse -> oro -->
    <linearGradient id="acG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <linearGradient id="steelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="moltenG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <radialGradient id="heatG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowF" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes latido {
      0%, 100% { opacity: 0.9;  filter: drop-shadow(0 0 12px #FB923Cb3); }
      50%      { opacity: 1;    filter: drop-shadow(0 0 26px #A855F7); }
    }
    @keyframes brasa {
      0%   { opacity: 0.9; }
      100% { opacity: 0; }
    }
    .fondo  { fill: url(#bgG); }
    .titulo { font-family: 'Outfit', 'Segoe UI', sans-serif; font-weight: 900; font-size: 42px;
              fill: url(#acG); animation: latido 3.2s infinite ease-in-out; }
    .sub    { font-family: 'Inter', 'Segoe UI', sans-serif; font-weight: 700; font-size: 13px;
              fill: #94A3B8; letter-spacing: 3px; }
    .chapa  { fill: #0F172A; stroke-width: 1.5; }
    .ctexto { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; }
  </style>

  <rect class="fondo" width="920" height="300" rx="14" stroke="url(#acG)" stroke-width="1.5"/>

  <!-- ==================== FORJA ANIMADA ==================== -->
  <g transform="translate(460, 92)">
    <!-- Halo de calor pulsante -->
    <circle cx="0" cy="14" r="90" fill="url(#heatG)">
      <animate attributeName="r" values="78;98;78" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Yunque -->
    <g filter="url(#glowF)">
      <!-- cara superior + cuerno -->
      <path d="M -46 -2 L 44 -2 L 60 6 L 44 12 L 30 12 L 30 16 L -30 16 L -30 6 L -46 6 Z"
            fill="url(#steelG)" stroke="url(#acG)" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- cintura -->
      <path d="M -16 16 L 16 16 L 12 30 L -12 30 Z" fill="url(#steelG)" stroke="url(#acG)" stroke-width="2"/>
      <!-- base -->
      <path d="M -34 30 L 34 30 L 40 44 L -40 44 Z" fill="url(#steelG)" stroke="url(#acG)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- Lingote fundido sobre el yunque (pulsa) -->
    <rect x="-20" y="-13" width="40" height="12" rx="4" fill="url(#moltenG)" filter="url(#glowF)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Martillo: pivota y golpea el lingote -->
    <g transform="translate(-2, -7)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-52 0 0; -52 0 0; 4 0 0; -8 0 0; -52 0 0"
                          keyTimes="0; 0.35; 0.5; 0.6; 1"
                          dur="1.6s" repeatCount="indefinite"
                          calcMode="spline"
                          keySplines="0.4 0 0.6 1; 0.9 0 1 1; 0.3 0 0.7 1; 0.4 0 0.6 1"/>
        <!-- mango -->
        <rect x="-5" y="-70" width="10" height="60" rx="4" fill="#7C4A21"/>
        <rect x="-5" y="-70" width="4" height="60" rx="2" fill="#A16207" opacity="0.7"/>
        <!-- cabeza -->
        <rect x="-26" y="-88" width="52" height="26" rx="5" fill="url(#steelG)" stroke="url(#acG)" stroke-width="2.5"/>
        <rect x="-26" y="-88" width="52" height="7" rx="3" fill="#94A3B8" opacity="0.6"/>
      </g>
    </g>

    <!-- Chispas: brotan en el impacto (sincronizadas al golpe ~0.5 del ciclo) -->
    <g fill="#FDE68A">
      <circle cx="0" cy="-8" r="2.6">
        <animate attributeName="cy" values="-8;-40" keyTimes="0;1" dur="0.5s" begin="0.72s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="0;-30" keyTimes="0;1" dur="0.5s" begin="0.72s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.5s" begin="0.72s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-8" r="3">
        <animate attributeName="cy" values="-8;-46" keyTimes="0;1" dur="0.5s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="0;6" keyTimes="0;1" dur="0.5s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.5s" begin="0.75s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-8" r="2.4">
        <animate attributeName="cy" values="-8;-38" keyTimes="0;1" dur="0.5s" begin="0.74s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="0;34" keyTimes="0;1" dur="0.5s" begin="0.74s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.5s" begin="0.74s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-8" r="2">
        <animate attributeName="cy" values="-8;-30" keyTimes="0;1" dur="0.5s" begin="0.76s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="0;18" keyTimes="0;1" dur="0.5s" begin="0.76s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.5s" begin="0.76s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-8" r="2">
        <animate attributeName="cy" values="-8;-32" keyTimes="0;1" dur="0.5s" begin="0.73s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="0;-16" keyTimes="0;1" dur="0.5s" begin="0.73s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.5s" begin="0.73s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Brasas ascendentes de fondo -->
    <g fill="#FB923C">
      <circle cx="-60" cy="30" r="2">
        <animate attributeName="cy" values="34;-30" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="64" cy="30" r="1.6">
        <animate attributeName="cy" values="34;-26" dur="4.1s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.8;0" dur="4.1s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-40" cy="30" r="1.4">
        <animate attributeName="cy" values="34;-20" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ==================== TEXTO ==================== -->
  <text x="460" y="188" text-anchor="middle" class="titulo">MULTIVERSETINKER</text>
  <text x="460" y="216" text-anchor="middle" class="sub">METALURGIA MODULAR · ALEACIONES · FORJA Y ARQUEOLOGIA · SIN SLIMEFUN</text>

  <!-- ==================== CHAPAS ==================== -->
  <g transform="translate(300, 245)">
    <rect x="0" y="0" width="90" height="30" rx="6" class="chapa" stroke="#FB923C"/>
    <text x="14" y="20" class="ctexto" fill="#FB923C">CHAGUI68</text>

    <rect x="105" y="0" width="135" height="30" rx="6" class="chapa" stroke="#38BDF8"/>
    <text x="117" y="20" class="ctexto" fill="#38BDF8">PAPER 1.21.11</text>

    <rect x="255" y="0" width="90" height="30" rx="6" class="chapa" stroke="#A3E635"/>
    <text x="269" y="20" class="ctexto" fill="#A3E635">JAVA 21</text>
  </g>
</svg>
