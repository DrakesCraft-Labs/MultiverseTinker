<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto" role="img" aria-label="MultiverseTinker — Celestial Forge Banner">
  <defs>
    <!-- Deep abyssal background (org star model) -->
    <linearGradient id="labVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="25%" stop-color="#150a04"/>
      <stop offset="55%" stop-color="#1c1206"/>
      <stop offset="85%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Forge nebulas: molten amber + emerald/cyan quantum accent -->
    <radialGradient id="nebulaMolten" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#FB923C" stop-opacity="0.16"/>
      <stop offset="80%" stop-color="#DC2626" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaEmerald" cx="50%" cy="32%" r="38%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Celestial fire title gradient (org model) -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="25%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#FDE68A"/>
      <stop offset="85%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <linearGradient id="steelG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="moltenG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <radialGradient id="anvilHeat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <pattern id="hexMatrix" width="40" height="69.282" patternUnits="userSpaceOnUse" patternTransform="scale(0.85)">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z"
            fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-opacity="0.05"/>
      <circle cx="20" cy="34.641" r="1" fill="#10B981" fill-opacity="0.18"/>
    </pattern>

    <filter id="glowLab" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="intenseGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feGaussianBlur stdDeviation="16" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes spinTachyon    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes spinTachyonRev { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
      @keyframes dashConduit    { to { stroke-dashoffset: -180; } }
      @keyframes twinkleLab     { 0%,100% { opacity: 0.25; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
      @keyframes borderShimmer  { 0%,100% { stroke-opacity: 0.5; } 50% { stroke-opacity: 1; } }
      @keyframes titlePulse     { 0%,100% { opacity: 0.9; filter: drop-shadow(0 0 12px rgba(245,158,11,0.7)); } 50% { opacity: 1; filter: drop-shadow(0 0 26px rgba(251,146,60,1)); } }
      @keyframes heatPulse      { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

      .tachyon-ring     { animation: spinTachyon 40s linear infinite;     transform-origin: 600px 150px; }
      .tachyon-ring-rev { animation: spinTachyonRev 26s linear infinite;  transform-origin: 600px 150px; }
      .conduit-flow     { stroke-dasharray: 12 16; animation: dashConduit 14s linear infinite; }
      .twinkle-node     { animation: twinkleLab 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .border-pulse     { animation: borderShimmer 4s ease-in-out infinite; }
      .title-a          { font-family: 'Outfit','Segoe UI',sans-serif; font-weight: 900; font-size: 58px; fill: url(#titleGrad); animation: titlePulse 3.5s ease-in-out infinite; }
      .sub-a            { font-family: 'Inter','Segoe UI',sans-serif; font-weight: 700; font-size: 16px; fill: #94A3B8; letter-spacing: 4px; }
      .heat-a           { animation: heatPulse 2.6s ease-in-out infinite; }
      .btext-a          { font-family: 'JetBrains Mono',monospace; font-size: 13px; font-weight: 700; }
    </style>
  </defs>

  <!-- Space background -->
  <rect width="1200" height="440" rx="24" fill="url(#labVoid)"/>
  <rect width="1200" height="440" rx="24" fill="url(#hexMatrix)"/>
  <circle cx="600" cy="150" r="320" fill="url(#nebulaMolten)"/>
  <circle cx="600" cy="135" r="200" fill="url(#nebulaEmerald)"/>

  <!-- Quantum conduits -->
  <g class="conduit-flow" opacity="0.35">
    <path d="M 60 80 L 380 80 L 470 150 M 1140 80 L 820 80 L 730 150" fill="none" stroke="#F59E0B" stroke-width="1.6"/>
    <path d="M 60 400 L 380 400 L 470 220 M 1140 400 L 820 400 L 730 220" fill="none" stroke="#10B981" stroke-width="1.6"/>
  </g>

  <!-- Twinkling stars -->
  <g fill="#FDE68A">
    <circle class="twinkle-node" cx="180" cy="110" r="2"/>
    <circle class="twinkle-node" cx="1020" cy="130" r="2.4" style="animation-delay:1.1s"/>
    <circle class="twinkle-node" cx="250" cy="320" r="1.8" style="animation-delay:0.6s"/>
    <circle class="twinkle-node" cx="960" cy="300" r="2" style="animation-delay:1.8s"/>
    <circle class="twinkle-node" cx="120" cy="220" r="1.6" style="animation-delay:2.3s"/>
    <circle class="twinkle-node" cx="1080" cy="230" r="1.6" style="animation-delay:0.3s"/>
  </g>

  <!-- Rotating tachyon rings around the forge core -->
  <g class="tachyon-ring">
    <circle cx="600" cy="150" r="120" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" stroke-dasharray="16 12" opacity="0.7"/>
    <circle cx="720" cy="150" r="4.5" fill="#F59E0B" filter="url(#glowLab)"/>
    <circle cx="480" cy="150" r="4.5" fill="#10B981" filter="url(#glowLab)"/>
  </g>
  <g class="tachyon-ring-rev">
    <polygon points="600,68 671,109 671,191 600,232 529,191 529,109" fill="none" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.5"/>
    <circle cx="671" cy="109" r="3.5" fill="#FDE68A" filter="url(#glowLab)"/>
    <circle cx="529" cy="191" r="3.5" fill="#FB923C" filter="url(#glowLab)"/>
  </g>

  <!-- ==================== FORGE CORE (centered at 600,150) ==================== -->
  <g transform="translate(600, 150)">
    <!-- heat halo -->
    <circle class="heat-a" cx="0" cy="18" r="95" fill="url(#anvilHeat)"/>

    <!-- Anvil -->
    <g filter="url(#glowLab)">
      <path d="M -52 -2 L 50 -2 L 68 8 L 50 16 L 34 16 L 34 20 L -34 20 L -34 8 L -52 8 Z"
            fill="url(#steelG)" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M -18 20 L 18 20 L 13 36 L -13 36 Z" fill="url(#steelG)" stroke="url(#ringGrad)" stroke-width="2"/>
      <path d="M -40 36 L 40 36 L 48 52 L -48 52 Z" fill="url(#steelG)" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- Molten ingot on the anvil face (pulses) -->
    <rect x="-24" y="-14" width="48" height="12" rx="4" fill="url(#moltenG)" filter="url(#glowLab)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Hammer: pivots above the ingot; at strike (angle 0) the head lands ON the ingot -->
    <g transform="translate(0, -96)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-58 0 0; -58 0 0; 0 0 0; -12 0 0; -58 0 0"
                          keyTimes="0; 0.34; 0.46; 0.56; 1"
                          dur="1.6s" repeatCount="indefinite"
                          calcMode="spline"
                          keySplines="0.4 0 0.6 1; 0.85 0 1 1; 0.3 0 0.7 1; 0.35 0 0.6 1"/>
        <!-- handle points straight down from pivot; head at the bottom rests on ingot at angle 0 -->
        <rect x="-6" y="6" width="12" height="60" rx="5" fill="#7C4A21"/>
        <rect x="-6" y="6" width="5"  height="60" rx="3" fill="#A16207" opacity="0.7"/>
        <rect x="-30" y="66" width="60" height="28" rx="6" fill="url(#steelG)" stroke="url(#ringGrad)" stroke-width="2.5"/>
        <rect x="-30" y="66" width="60" height="8"  rx="4" fill="#CBD5E1" opacity="0.55"/>
      </g>
    </g>

    <!-- Impact sparks (burst synced to the strike ~0.46 of the 1.6s cycle => ~0.74s) -->
    <g fill="#FDE68A" filter="url(#glowLab)">
      <circle cx="0" cy="-10" r="3">
        <animate attributeName="cx" values="0;-46" dur="0.55s" begin="0.74s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-10;-52" dur="0.55s" begin="0.74s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.55s" begin="0.74s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-10" r="3.4">
        <animate attributeName="cx" values="0;8" dur="0.55s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-10;-60" dur="0.55s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.55s" begin="0.75s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-10" r="2.8">
        <animate attributeName="cx" values="0;50" dur="0.55s" begin="0.74s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-10;-48" dur="0.55s" begin="0.74s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.55s" begin="0.74s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-10" r="2.4">
        <animate attributeName="cx" values="0;28" dur="0.55s" begin="0.76s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-10;-38" dur="0.55s" begin="0.76s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.55s" begin="0.76s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="-10" r="2.4">
        <animate attributeName="cx" values="0;-26" dur="0.55s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="-10;-40" dur="0.55s" begin="0.75s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="0.55s" begin="0.75s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Rising embers -->
    <g fill="#FB923C">
      <circle cx="-70" cy="36" r="2.2">
        <animate attributeName="cy" values="40;-34" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="3.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="72" cy="36" r="1.8">
        <animate attributeName="cy" values="40;-30" dur="4.1s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="4.1s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-44" cy="36" r="1.5">
        <animate attributeName="cy" values="40;-24" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.85;0" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- ==================== TEXT ==================== -->
  <text x="600" y="330" text-anchor="middle" class="title-a" filter="url(#intenseGlow)">MULTIVERSETINKER</text>
  <text x="600" y="362" text-anchor="middle" class="sub-a">MODULAR METALLURGY · CUSTOM ALLOYS · FORGE &amp; GEOLOGICAL ARCHAEOLOGY · STANDALONE</text>

  <!-- ==================== BADGES ==================== -->
  <g transform="translate(600, 398)">
    <rect x="-235" y="-15" width="130" height="30" rx="6" fill="#0F172A" stroke="#FB923C" stroke-width="1.5"/>
    <text x="-170" y="5" text-anchor="middle" class="btext-a" fill="#FB923C">CHAGUI68</text>

    <rect x="-90" y="-15" width="180" height="30" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" class="btext-a" fill="#38BDF8">PAPER 1.21.11</text>

    <rect x="105" y="-15" width="130" height="30" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="170" y="5" text-anchor="middle" class="btext-a" fill="#10B981">JAVA 21</text>
  </g>

  <!-- Holographic border -->
  <rect class="border-pulse" x="3" y="3" width="1194" height="434" rx="22" fill="none" stroke="url(#cyberBorder)" stroke-width="2"/>
</svg>
