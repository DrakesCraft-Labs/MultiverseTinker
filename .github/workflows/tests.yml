name: Tests

# Proves on every push and pull request that one jar serves every supported server:
#
#   build   - JDK 21 builds the release jar against Paper 1.21.11 (the oldest supported server) and
#             runs the whole MockBukkit suite on it.
#   compat  - JDK 25 replays the suite on Paper 26.1 and 26.2 twice: once on the 1.21.11 bytecode
#             (the jar players actually install must link against the newer API) and once recompiled
#             from source (the project must keep building on the newer API).
#   server  - boots a real Paper 1.21.11, 26.1.2 and 26.2 server with the built jar, runs
#             /mvtink verify and /mvtink reload from the console and fails on any error the plugin logs.
#
# No secrets are used, so it is safe to run on pull requests from forks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Paper 1.21.11, JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run the test suite
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-1.21.11
          path: target/surefire-reports

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error

  compat:
    name: Test suite on Paper ${{ matrix.minecraft }} (JDK 25)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1'
            profile: mc-26.1
          - minecraft: '26.2'
            profile: mc-26.2
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile the release bytecode against Paper 1.21.11
        run: ./mvnw -B -ntp clean compile

      - name: Run the suite on that bytecode against Paper ${{ matrix.minecraft }}
        run: ./mvnw -B -ntp test -P${{ matrix.profile }} -Dmaven.main.skip=true

      - name: Rebuild from source against Paper ${{ matrix.minecraft }} and run the suite
        run: ./mvnw -B -ntp clean test -P${{ matrix.profile }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.minecraft }}
          path: target/surefire-reports

  server:
    name: Real server on Paper ${{ matrix.minecraft }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            java: '21'
          - minecraft: '26.1.2'
            java: '25'
          - minecraft: '26.2'
            java: '25'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download the plugin jar
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: dist

      - name: Boot Paper ${{ matrix.minecraft }} with the plugin
        run: |
          chmod +x .github/scripts/paper-smoke-test.sh
          .github/scripts/paper-smoke-test.sh "${{ matrix.minecraft }}" "$(ls dist/*.jar | head -n1)"

      - name: Upload the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ matrix.minecraft }}-log
          path: smoke-logs
          if-no-files-found: ignore
